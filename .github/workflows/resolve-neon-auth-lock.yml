name: Resolve Neon Auth lockfile

on:
  push:
    branches:
      - migration/supabase-to-neon
    paths:
      - .github/workflows/resolve-neon-auth-lock.yml

permissions:
  contents: read

jobs:
  resolve-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolve exact Neon Auth dependency
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps --save-exact @neondatabase/auth@0.5.0-beta

      - name: Upload resolved manifests
        uses: actions/upload-artifact@v4
        with:
          name: neon-auth-manifests
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
